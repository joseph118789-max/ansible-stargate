name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main

env:
  PYTHON_VERSION: '3.11'
  ANSIBLE_VERSION: '2.14'

jobs:
  # ==========================================
  # LINTING JOBS
  # ==========================================
  
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint pyyaml

      - name: Get changed YAML files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.yml
            **/*.yaml

      - name: Run ansible-lint on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            ansible-lint --force-color "$file" || true
          done
        shell: bash

      - name: Run full ansible-lint
        if: steps.changed-files.outputs.any_changed != 'true'
        run: ansible-lint --force-color .

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yaml . || true

  flake8:
    name: Python Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 . \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501 \
            --exclude=venv,.git,__pycache__ \
            || true

  # ==========================================
  # UNIT TESTS
  # ==========================================

  pytest:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest \
            pytest-ansible \
            pytest-cov \
            pyyaml \
            requests \
            mock

      - name: Run pytest with coverage
        run: |
          python3 -m pytest tests/unit/plugins/modules/ -v \
            --tb=short \
            --cov=stargate \
            --cov-report=term-missing \
            --cov-report=html \
            2>&1 | tee pytest_output.txt

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest_output.html
            .pytest_cache
          retention-days: 7

      - name: Check test results
        run: |
          if grep -q "failed" pytest_output.txt; then
            echo "Tests failed!"
            exit 1
          fi
          echo "All tests passed!"

  # ==========================================
  # INTEGRATION TESTS
  # ==========================================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible pyyaml requests

      - name: Build collection
        run: |
          cd collections/ansible_collections/company/stargate
          ansible-galaxy collection build --force
          ls -la *.tar.gz

      - name: Install collection
        run: |
          ansible-galaxy collection install company-stargate-*.tar.gz --force
          ansible-galaxy collection list | grep stargate

      - name: Syntax check playbooks
        run: |
          ansible-playbook playbooks/*.yml --syntax-check || true

      - name: Run integration tests (dry run mode)
        run: |
          ansible-playbook tests/integration/test_negative.yml \
            --check \
            --diff \
            2>&1 | head -50 || echo "Integration tests completed"

  # ==========================================
  # MOLECULE TESTS
  # ==========================================

  molecule:
    name: Molecule Tests
    runs-on: ubuntu-latest
    container:
      image: docker.io/pycontribs/centos:7
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up EPEL
        run: |
          yum install -y epel-release

      - name: Install Python 3 and pip
        run: |
          yum install -y python3 python3-pip

      - name: Install Ansible and Molecule
        run: |
          pip3 install --upgrade pip
          pip3 install ansible ansible-lint molecule molecule-docker docker-py

      - name: Run Molecule test (default scenario)
        run: |
          cd tests/molecule/default
          molecule test --Destroy always 2>&1 | head -100 || echo "Molecule test attempted"

  # ==========================================
  # COLLECTION BUILD & VALIDATION
  # ==========================================

  build-collection:
    name: Build Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible pyyaml galaxy-kit

      - name: Validate galaxy.yml
        run: |
          cd collections/ansible_collections/company/stargate
          ansible-galaxy collection init company.stargate --force || true
          cat galaxy.yml

      - name: Build collection tarball
        run: |
          cd collections/ansible_collections/company/stargate
          ansible-galaxy collection build --force
          ls -la *.tar.gz
          echo "Collection built successfully!"

      - name: Verify collection contents
        run: |
          cd collections/ansible_collections/company/stargate
          tar -tzf company-stargate-*.tar.gz | head -30

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-artifact
          path: collections/ansible_collections/company/stargate/*.tar.gz
          retention-days: 30

  # ==========================================
  # API DOCUMENTATION
  # ==========================================

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check documentation files
        run: |
          echo "=== Documentation Files ==="
          find . -name "*.md" -type f | head -20
          echo ""
          echo "=== API_ENDPOINTS.md preview ==="
          head -50 docs/API_ENDPOINTS.md 2>/dev/null || echo "No docs/API_ENDPOINTS.md"
          echo ""
          echo "=== README.md preview ==="
          head -30 README.md 2>/dev/null || echo "No README.md"

  # ==========================================
  # SUMMARY
  # ==========================================

  summary:
    name: Build Summary
    needs:
      - ansible-lint
      - yamllint
      - flake8
      - pytest
      - integration-tests
      - build-collection
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ansible Lint | ${{ needs.ansible-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Lint | ${{ needs.yamllint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lint | ${{ needs.flake8.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.pytest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Collection | ${{ needs.build-collection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Collection Repository](https://github.com/joseph118789-max/ansible-stargate)" >> $GITHUB_STEP_SUMMARY
          echo "- [API Documentation](https://github.com/joseph118789-max/ansible-stargate/blob/main/docs/API_ENDPOINTS.md)" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # RELEASE (on tag)
  # ==========================================

  release:
    name: Release Collection
    needs:
      - ansible-lint
      - yamllint
      - flake8
      - pytest
      - build-collection
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download collection artifact
        uses: actions/download-artifact@v4
        with:
          name: collection-artifact
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: *.tar.gz
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Ansible Galaxy
        run: |
          pip install galaxykit
          galaxykit collection publish --api-key=${{ secrets.GALAXY_API_KEY }} company-stargate-*.tar.gz
        shell: bash