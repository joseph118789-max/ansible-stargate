---
# Playbook: Account Management
# Lists accounts and retrieves account password information for auditing
- name: Stargate Account Management
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://10.201.208.160:8443"
    stargate_token: "ansible:d147ef1f-896d-487c-833e-28154903afc5"
    stargate_validate_certs: false

  tasks:
    # List all accounts with pagination
    - name: List all accounts
      company.stargate.stargate_account:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: accountCommonGet
        start: 0
        length: 100
      register: accounts_result

    - name: Display accounts list
      ansible.builtin.debug:
        msg:
          - "=== Account Audit Report ==="
          - "Total accounts found: {{ accounts_result.account | length if accounts_result.account is list else 0 }}"

    # Get account details for auditing
    - name: Show account details for audit
      ansible.builtin.debug:
        msg: "Account: {{ item }}"
      loop: "{{ accounts_result.account }}"
      when: accounts_result.account is defined and accounts_result.account is iterable

    # Get passwords for specific accounts (requires account ID)
    - name: Get account passwords
      when: accounts_result.account is defined and accounts_result.account is iterable
      block:
        - name: Retrieve password for each account
          company.stargate.stargate_account:
            server: "{{ stargate_server }}"
            token: "{{ stargate_token }}"
            validate_certs: "{{ stargate_validate_certs }}"
            operation: accountPasswordGet
            account_data:
              id: "{{ item.id }}"
          register: password_result
          loop: "{{ accounts_result.account }}"
          when: item.id is defined

        - name: Display password audit results
          ansible.builtin.debug:
            msg:
              - "Account ID: {{ item.item.id }}"
              - "Account Name: {{ item.item.name | default('N/A') }}"
              - "Password status: Retrieved"
          loop: "{{ password_result.results }}"
          loop_control:
            label: "{{ item.item.id }}"
          when: password_result.results is defined

    # Summary for audit report
    - name: Display account audit summary
      ansible.builtin.debug:
        msg:
          - "=== Account Management Summary ==="
          - "Total accounts audited: {{ accounts_result.account | length if accounts_result.account is list else 0 }}"
          - "Password audit completed"
          - "All account operations completed successfully"