---
# Playbook: Connection Management
# Demonstrates connection operations: list, count, create, delete
#
# Usage:
#   ansible-playbook playbooks/connection-management.yml \
#     -e "stargate_server=https://10.201.208.160:8443" \
#     -e "stargate_token=ansible:YOUR_TOKEN"
#
- name: Stargate Connection Management
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "{{ lookup('env', 'STARIMATE_SERVER') | default('https://10.201.208.160:8443', true) }}"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"
    stargate_validate_certs: false

  tasks:
    # Get all connections with pagination
    - name: Get all connections
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionGet
        start: 0
        length: 50
      register: connections_result

    - name: Display connections
      ansible.builtin.debug:
        msg: "Connections retrieved: {{ connections_result.connections | length }} records"

    # Count connections
    - name: Count total connections
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionCount
      register: conn_count_result

    - name: Display connection count
      ansible.builtin.debug:
        msg: "Total connection count: {{ conn_count_result.count }}"

    # Create a test connection (RDP)
    - name: Create test RDP connection
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionCreate
        connection_data:
          name: "ansible_test_rdp"
          protocol: "1"
          hostname: "192.168.1.100"
          port: "3389"
          loginWith: "Username and Password"
          colorDepth: "16"
      register: create_conn_result

    - name: Display created connection result
      ansible.builtin.debug:
        msg: "Connection creation result: {{ create_conn_result.msg }}"
      when: create_conn_result.changed

    # Create a test connection (SSH)
    - name: Create test SSH connection
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionCreate
        connection_data:
          name: "ansible_test_ssh"
          protocol: "2"
          hostname: "192.168.1.50"
          port: "22"
      register: create_ssh_result

    - name: Display SSH connection result
      ansible.builtin.debug:
        msg: "SSH connection result: {{ create_ssh_result.msg }}"
      when: create_ssh_result.changed

    # Delete test connections
    - name: Delete test RDP connection
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionDelete
        connection_data:
          name: "ansible_test_rdp"
      when: create_conn_result.changed

    - name: Delete test SSH connection
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionDelete
        connection_data:
          name: "ansible_test_ssh"
      when: create_ssh_result.changed

    # Summary
    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - "=== Connection Management Summary ==="
          - "Total connections: {{ conn_count_result.count }}"
          - "Test connections created and deleted successfully"