---
# Playbook: Daily Report
# Generates daily operational report from Stargate
#
# Usage:
#   ansible-playbook playbooks/daily-report.yml \
#     -e "stargate_server=https://10.201.208.160:8443" \
#     -e "stargate_token=ansible:YOUR_TOKEN"
#
- name: Stargate Daily Report
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "{{ lookup('env', 'STARIMATE_SERVER') | default('https://10.201.208.160:8443', true) }}"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"
    stargate_validate_certs: false

  tasks:
    # User statistics
    - name: Get user count
      company.stargate.stargate_user:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: userCount
      register: user_count

    - name: Get all users
      company.stargate.stargate_user:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: userGet
        start: 0
        length: 100
      register: all_users

    # Connection statistics
    - name: Get connection count
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionCount
      register: conn_count

    - name: Get all connections
      company.stargate.stargate_connection:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: connectionGet
        start: 0
        length: 100
      register: all_connections

    # Account statistics
    - name: Get all accounts
      company.stargate.stargate_account:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        operation: accountCommonGet
        start: 0
        length: 100
      register: all_accounts

    # Monitoring statistics
    - name: Get monitored user count
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        endpoint: /userMonitoringCount
        data: {}
      register: monitored_users

    - name: Get monitored connection count
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        validate_certs: "{{ stargate_validate_certs }}"
        endpoint: /connectionMonitoringCount
        data: {}
      register: monitored_connections

    # Generate report
    - name: Generate daily report
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "       STARIMATE DAILY REPORT"
          - "=========================================="
          - "Date: {{ ansible_date_time.iso8601 }}"
          - ""
          - "USER STATISTICS"
          - "  Total Users: {{ user_count.user }}"
          - "  Active Users: {{ all_users.user | json_query('[?isActive==`1`]') | length }}"
          - "  Admin Users: {{ all_users.user | json_query('[?isAdmin==`1`]') | length }}"
          - ""
          - "CONNECTION STATISTICS"
          - "  Total Connections: {{ conn_count.count }}"
          - "  Connections: {{ all_connections.connections | length }}"
          - ""
          - "ACCOUNT STATISTICS"
          - "  Total Accounts: {{ all_accounts.accounts | length }}"
          - ""
          - "MONITORING"
          - "  Monitored Users: {{ monitored_users.data.message }}"
          - "  Monitored Connections: {{ monitored_connections.data.message }}"
          - "=========================================="

    # Save report to file
    - name: Save report to file
      ansible.builtin.copy:
        content: |
          STARIMATE DAILY REPORT - {{ ansible_date_time.iso8601 }}
          
          USER STATISTICS
          Total Users: {{ user_count.user }}
          Active Users: {{ all_users.user | json_query('[?isActive==`1`]') | length }}
          Admin Users: {{ all_users.user | json_query('[?isAdmin==`1`]') | length }}
          
          CONNECTION STATISTICS
          Total Connections: {{ conn_count.count }}
          
          ACCOUNT STATISTICS
          Total Accounts: {{ all_accounts.accounts | length }}
          
          MONITORING
          Monitored Users: {{ monitored_users.data.message }}
          Monitored Connections: {{ monitored_connections.data.message }}
        dest: "/tmp/stargate-report-{{ ansible_date_time.year }}{{ ansible_date_time.month }}{{ ansible_date_time.day }}.txt"
      when: ansible_check_mode == false