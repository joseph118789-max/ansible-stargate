"""Molecule scenario for connection module testing."""

dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: stargate-connection-test
    image: docker.io/pycontribs/centos:7
    pre_build_image: true
    privileged: true
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/ansible
      local_tmp: /tmp/ansible-local
  inventory:
    group_vars:
      all:
        stargate_server: "https://YOUR_SERVER_IP:8443"
        stargate_token: "ansible:YOUR_TOKEN"
        validate_certs: false
    host_vars:
      localhost:
        ansible_connection: local
verifier:
  name: ansible
lint: |
  set -e
  ansible-lint .
  yamllint .
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy