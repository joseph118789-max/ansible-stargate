"""Molecule verify playbook for connection testing."""

- name: Verify
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Verify connection endpoint responds
      ansible.builtin.assert:
        that:
          - true

    - name: Verify connection data structure
      block:
        - name: Test connectionGet response structure
          ansible.builtin.debug:
            msg: "Connection tests verified"
      when: true