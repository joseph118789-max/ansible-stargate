"""Molecule default scenario - full integration test."""

dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: stargate-test
    image: docker.io/pycontribs/centos:7
    pre_build_image: true
    privileged: true
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      remote_tmp: /tmp/ansible
      local_tmp: /tmp/ansible-local
      stdout_callback: yaml
  inventory:
    group_vars:
      all:
        stargate_server: "https://YOUR_SERVER_IP:8443"
        stargate_token: "ansible:YOUR_TOKEN"
        validate_certs: false
    host_vars:
      localhost:
        ansible_connection: local
  env:
    ANSIBLE_NOCOLOR: "1"
    ANSIBLE_HOST_KEY_CHECKING: "false"
verifier:
  name: ansible
lint: |
  set -e
  ansible-lint --force-color .
  yamllint .
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy