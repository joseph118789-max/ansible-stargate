"""Molecule converge playbook - full workflow test."""

- name: Converge - Full Stargate Workflow
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://10.201.208.160:8443"
    stargate_token: "ansible:f8ab2c83-0bcb-4d15-b5da-afbc19cbb41c"
    validate_certs: false

  tasks:
    - name: Step 1 - Get server info (ping equivalent)
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/userCount"
        validate_certs: "{{ validate_certs }}"
      register: server_info

    - name: Display server status
      ansible.builtin.debug:
        msg: "Server responded with count: {{ server_info.data.message }}"

    - name: Step 2 - Get users
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/userGet"
        data:
          start: "0"
          length: "10"
        validate_certs: "{{ validate_certs }}"
      register: users_result

    - name: Display users
      ansible.builtin.debug:
        msg: "Found {{ users_result.data.user | length }} users"

    - name: Step 3 - Get connections
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionGet"
        data:
          start: "0"
          length: "10"
        validate_certs: "{{ validate_certs }}"
      register: connections_result

    - name: Display connections
      ansible.builtin.debug:
        msg: "Found {{ connections_result.data.connection | length }} connections"

    - name: Step 4 - Get accounts
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/accountCommonGet"
        data:
          start: "0"
          length: "10"
        validate_certs: "{{ validate_certs }}"
      register: accounts_result

    - name: Display accounts
      ansible.builtin.debug:
        msg: "Found {{ accounts_result.data.account | length }} accounts"

    - name: Step 5 - Verify data structures
      ansible.builtin.assert:
        that:
          - users_result.data.user is defined
          - connections_result.data.connection is defined
          - accounts_result.data.errorMsg is defined or accounts_result.data.account is defined