#!/usr/bin/env ansible-playbook
# Tests for services role
# Run: ansible-playbook -i localhost, tests/roles/test_services.yml
# NOTE: serviceStatusGet returns 404 on server - endpoint may require higher permissions

- name: Test Stargate Services Role
  hosts: localhost
  gather_facts: false
  vars:
    stg_server: "https://10.201.208.160:8443"
    stg_token: "ansible:f8ab2c83-0bcb-4d15-b5da-afbc19cbb41c"
    stg_validate_certs: false
    stg_use_ssl: true
    stg_timeout: 30

  tasks:
    - name: List all services
      ansible.builtin.include_role:
        name: company.stargate.services
      vars:
        stargate_server: "{{ stg_server }}"
        stargate_token: "{{ stg_token }}"
        stargate_validate_certs: "{{ stg_validate_certs }}"
        stargate_use_ssl: "{{ stg_use_ssl }}"
        stargate_timeout: "{{ stg_timeout }}"
        service_operation: list
      ignore_errors: true
      register: service_result

    - name: Check result
      ansible.builtin.debug:
        msg: "⚠️ serviceStatusGet endpoint returns 404 - requires API user with service permissions"