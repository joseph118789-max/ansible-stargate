#!/usr/bin/env ansible-playbook
# Tests for user role
# Run: ansible-playbook -i localhost, tests/roles/test_user.yml

- name: Test Stargate User Role
  hosts: localhost
  gather_facts: false
  vars:
    stg_server: "https://YOUR_SERVER_IP:8443"
    stg_token: "ansible:YOUR_TOKEN"
    stg_validate_certs: false
    stg_use_ssl: true
    stg_timeout: 30

  tasks:
    - name: Get users (list operation)
      ansible.builtin.include_role:
        name: company.stargate.user
      vars:
        stargate_server: "{{ stg_server }}"
        stargate_token: "{{ stg_token }}"
        stargate_validate_certs: "{{ stg_validate_certs }}"
        stargate_use_ssl: "{{ stg_use_ssl }}"
        stargate_timeout: "{{ stg_timeout }}"
        user_operation: get
        user_start: 0
        user_length: 10

    - name: Verify users were returned
      ansible.builtin.assert:
        that:
          - user_get_result.user is defined
          - user_get_result.user | length > 0

    - name: Display user count
      ansible.builtin.debug:
        msg: "✅ Found {{ user_get_result.user | length }} users"

    - name: Get user count
      ansible.builtin.include_role:
        name: company.stargate.user
      vars:
        stargate_server: "{{ stg_server }}"
        stargate_token: "{{ stg_token }}"
        stargate_validate_certs: "{{ stg_validate_certs }}"
        stargate_use_ssl: "{{ stg_use_ssl }}"
        stargate_timeout: "{{ stg_timeout }}"
        user_operation: count

    - name: Verify count was returned
      ansible.builtin.assert:
        that:
          - user_count_result.message is defined

    - name: Display count result
      ansible.builtin.debug:
        msg: "✅ User count: {{ user_count_result.message }}"