#!/usr/bin/env ansible-playbook
# Tests for alarms role
# Run: ansible-playbook -i localhost, tests/roles/test_alarms.yml
# NOTE: alarmGet returns 404 on server - endpoint may require higher permissions

- name: Test Stargate Alarms Role
  hosts: localhost
  gather_facts: false
  vars:
    stg_server: "https://10.201.208.160:8443"
    stg_token: "ansible:d147ef1f-896d-487c-833e-28154903afc5"
    stg_validate_certs: false
    stg_use_ssl: true
    stg_timeout: 30

  tasks:
    - name: List all alarms
      ansible.builtin.include_role:
        name: company.stargate.alarms
      vars:
        stargate_server: "{{ stg_server }}"
        stargate_token: "{{ stg_token }}"
        stargate_validate_certs: "{{ stg_validate_certs }}"
        stargate_use_ssl: "{{ stg_use_ssl }}"
        stargate_timeout: "{{ stg_timeout }}"
        alarm_operation: list
      ignore_errors: true
      register: alarm_result

    - name: Check result
      ansible.builtin.debug:
        msg: "⚠️ alarmGet endpoint returns 404 - requires API user with alarm permissions"