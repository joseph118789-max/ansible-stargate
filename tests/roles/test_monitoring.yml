#!/usr/bin/env ansible-playbook
# Tests for monitoring role
# Run: ansible-playbook -i localhost, tests/roles/test_monitoring.yml

- name: Test Stargate Monitoring Role
  hosts: localhost
  gather_facts: false
  vars:
    stg_server: "https://YOUR_SERVER_IP:8443"
    stg_token: "ansible:YOUR_TOKEN"
    stg_validate_certs: false
    stg_use_ssl: true
    stg_timeout: 30

  tasks:
    - name: Run monitoring role
      ansible.builtin.include_role:
        name: company.stargate.monitoring
      vars:
        stargate_server: "{{ stg_server }}"
        stargate_token: "{{ stg_token }}"
        stargate_validate_certs: "{{ stg_validate_certs }}"
        stargate_use_ssl: "{{ stg_use_ssl }}"
        stargate_timeout: "{{ stg_timeout }}"
        monitor_critical_threshold: 100
        monitor_high_threshold: 100
        monitor_offline_node_threshold: 100
        monitor_verbose: true

    - name: Verify monitoring metrics were collected
      ansible.builtin.assert:
        that:
          - monitoring_metrics is defined
          - monitoring_metrics.total_active_alarms is defined

    - name: Display monitoring summary
      ansible.builtin.debug:
        msg: "✅ Monitoring metrics collected successfully"