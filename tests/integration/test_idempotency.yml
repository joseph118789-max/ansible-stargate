- name: Idempotency Test - Connection Delete
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://YOUR_SERVER_IP:8443"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"
    test_connection_name: "test-idempotent-delete"

  tasks:
    - name: Create a connection to delete
      company.stargate.stargate_post:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionCreate"
        data:
          name: "{{ test_connection_name }}"
          protocol: "1"
          hostname: "192.168.1.100"
          port: "3389"
      register: create_result
      ignore_errors: true

    - name: First run - Delete connection
      company.stargate.stargate_post:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionDelete"
        data:
          connectionName: "{{ test_connection_name }}"
      register: first_delete
      ignore_errors: true

    - name: Second run - Delete again (should handle gracefully)
      company.stargate.stargate_post:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionDelete"
        data:
          connectionName: "{{ test_connection_name }}"
      register: second_delete
      ignore_errors: true


- name: Idempotency Test - Get Endpoints
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://YOUR_SERVER_IP:8443"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"

  tasks:
    - name: First run - Get users
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/userGet"
        data:
          start: "0"
          length: "10"
      register: first_run

    - name: Second run - Get users again (should be identical)
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/userGet"
        data:
          start: "0"
          length: "10"
      register: second_run

    - name: Verify same result
      assert:
        that:
          - first_run.data.user | count == second_run.data.user | count


