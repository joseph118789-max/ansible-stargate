- name: Idempotency Test - Full Workflow Run Twice
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://YOUR_SERVER_IP:8443"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"

  tasks:
    - name: First workflow run - Get all data
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/userGet"
        data:
          start: "0"
          length: "10"
      register: first_workflow

    - name: Second workflow run - Get all data again
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/userGet"
        data:
          start: "0"
          length: "10"
      register: second_workflow

    - name: Verify results are consistent
      assert:
        that:
          - first_workflow.data.errorMsg == second_workflow.data.errorMsg
          - first_workflow.data.user | length == second_workflow.data.user | length