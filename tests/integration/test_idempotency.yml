"""Idempotency test cases for Stargate Ansible collection.

These tests verify that running the same playbook multiple times
produces the same end state without creating duplicate resources.
"""

- name: Idempotency Test - Connection Create
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://YOUR_SERVER_IP:8443"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"
    test_connection_name: "test-idempotent-conn"

  tasks:
    - name: First run - Create connection
      company.stargate.stargate_post:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionCreate"
        data:
          name: "{{ test_connection_name }}"
          protocol: "1"
          hostname: "192.168.1.100"
          port: "3389"
      register: first_run

    - name: Second run - Should not create duplicate
      company.stargate.stargate_post:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionCreate"
        data:
          name: "{{ test_connection_name }}"
          protocol: "1"
          hostname: "192.168.1.100"
          port: "3389"
      register: second_run
      ignore_errors: true

    - name: Verify idempotency
      assert:
        that:
          - first_run.changed is defined
          - second_run.changed is defined


