"""Negative test cases for Stargate Ansible collection."""

- name: Negative Test - Invalid Authentication
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://10.201.208.160:8443"
    invalid_token: "ansible:invalid-token-12345"

  tasks:
    - name: Test with invalid token - should fail
      company.stargate.stargate_get:
        server: "{{ stargate_server }}"
        token: "{{ invalid_token }}"
        endpoint: "/userGet"
        data:
          start: "0"
          length: "10"
      register: result
      ignore_errors: true
      failed_when: result is succeeded

    - name: Verify auth failure
      assert:
        that:
          - result.failed is defined
          - result.status_code in [401, 403] or 'error' in result.msg


