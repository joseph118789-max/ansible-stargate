- name: Negative Test - Duplicate Resource
  hosts: localhost
  gather_facts: no
  vars:
    stargate_server: "https://10.201.208.160:8443"
    stargate_token: "ansible:f8ab2c83-0bcb-4d15-b5da-afbc19cbb41c"

  tasks:
    - name: Create connection first time
      company.stargate.stargate_post:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionCreate"
        data:
          name: "test-duplicate-conn"
          protocol: "1"
          hostname: "192.168.1.100"
          port: "3389"
      register: first_result
      ignore_errors: true

    - name: Try to create same connection again - should get conflict
      company.stargate.stargate_post:
        server: "{{ stargate_server }}"
        token: "{{ stargate_token }}"
        endpoint: "/connectionCreate"
        data:
          name: "test-duplicate-conn"
          protocol: "1"
          hostname: "192.168.1.100"
          port: "3389"
      register: second_result
      ignore_errors: true
      failed_when: second_result is succeeded


- name: Negative Test - SQL Injection in Parameters
