# Sample Inventory for ansible-stargate collection
# Save as inventory.yml and use with: ansible-playbook -i inventory.yml playbook.yml

all:
  vars:
    # Stargate Server Configuration
    # IMPORTANT: Set these via environment variables or ansible-vault
    #   export STARIMATE_SERVER="https://10.201.208.160:8443"
    #   export STARIMATE_TOKEN="ansible:YOUR_TOKEN_HERE"
    #
    # Or override with -e flag:
    #   ansible-playbook -i inventory.yml playbook.yml \
    #     -e "stargate_server=https://10.201.208.160:8443" \
    #     -e "stargate_token=ansible:YOUR_TOKEN"
    
    stargate_server: "{{ lookup('env', 'STARIMATE_SERVER') | default('https://10.201.208.160:8443', true) }}"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"
    stargate_validate_certs: false
    stargate_timeout: 30
    stargate_retries: 3
    
  children:
    # Local execution group
    localhost:
      hosts:
        localhost:
          ansible_connection: local
    
    # Stargate server group (for running against remote targets)
    stargate_servers:
      hosts:
        stargate-01:
          ansible_host: 10.201.208.160
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519

---
# Alternative: Production inventory with multiple environments

production:
  vars:
    # Override defaults for production
    stargate_server: "https://10.201.208.160:8443"
    stargate_validate_certs: false
    # Token should come from environment or vault
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"
  children:
    api_servers:
      hosts:
        stargate-prod:
          ansible_host: 10.201.208.160
        stargate-dr:
          ansible_host: 10.201.208.161
    monitoring_targets:
      hosts:
        monitor-01:
          ansible_host: 192.168.1.100
          monitor_interval: 60
        monitor-02:
          ansible_host: 192.168.1.101
          monitor_interval: 120

development:
  vars:
    stargate_server: "{{ lookup('env', 'STARIMATE_SERVER') | default('https://dev.stargate.local:8443', true) }}"
    stargate_token: "{{ lookup('env', 'STARIMATE_TOKEN') | default('CHANGE_ME', true) }}"
    stargate_validate_certs: false
  children:
    dev_servers:
      hosts:
        dev-stargate:
          ansible_host: 192.168.1.50