namespace: company
name: stargate
version: 1.0.0
readme: README.md
authors:
  - Company Automation Team <automation@company.com>
description: |
  Ansible collection for MasterSAM Stargate REST API v11.7.0 automation.
  
  This collection provides modules, roles, and playbooks for managing
  MasterSAM Stargate privileged access management system through its
  REST API interface.
  
  **Key Features:**
  - Authentication and session management
  - User, connection, and account CRUD operations
  - Alarm monitoring and management
  - Node and service discovery
  - Backup and reporting workflows
  
  **Supported API Version:** v11.7.0
  **Server Requirements:** Stargate server with REST API enabled

