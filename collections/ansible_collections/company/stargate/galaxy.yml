changelog: |
  ## 1.0.0 (2026-05-19)
  
  **Initial Release**
  
  - 11 custom Ansible modules for Stargate REST API
  - 10 roles for common automation workflows
  - 5 sample playbooks for typical use cases
  - Comprehensive unit and integration tests (123 tests passing)
  - Full API documentation with 75+ endpoints documented
  - Molecule scenarios for CI/CD integration testing
  - GitHub Actions workflow for automated linting and testing

