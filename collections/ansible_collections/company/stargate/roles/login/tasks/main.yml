---
# tasks file for login role

- name: Validate login parameters
  ansible.builtin.assert:
    that:
      - stargate_username is defined
      - stargate_username | length > 0
      - stargate_password is defined
      - stargate_password | length > 0
    fail_msg: "stargate_username and stargate_password must be defined"
    quiet: true

- name: Build raw token (username:token format)
  ansible.builtin.set_fact:
    stargate_token_raw: "{{ stargate_username }}:{{ stargate_password }}"

- name: Store token as fact for downstream tasks
  ansible.builtin.set_fact:
    stargate_token: "{{ stargate_token_raw }}"
    stargate_logged_in: true

- name: Display login status
  ansible.builtin.debug:
    msg: "Stargate authentication prepared. Token will be used for subsequent API calls."